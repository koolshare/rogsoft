# Include inside both asusgo.koolcenter.com server blocks.
location ~ ^/(rogsoft|mtksoft|qcasoft|ipq32soft|ipq64soft)/((softcenter|koolcenter)/app(_nousb)?|softcenter/push_message)\.json\.js$ {
    proxy_pass http://127.0.0.1:9012;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    proxy_set_header If-Range "";
    proxy_set_header Range "";
    proxy_hide_header Cache-Control;
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    proxy_hide_header Expires;
    proxy_hide_header Accept-Ranges;
    if_modified_since off;
    max_ranges 0;
    add_header Cache-Control "no-store" always;

    access_by_lua_block {
        local args, err = ngx.req.get_uri_args(32)
        if err then return ngx.exit(400) end
        local cb = args.callback
        if cb == nil then return end
        if type(cb) ~= "string" or #cb > 128 or not cb:match("^[A-Za-z_$][A-Za-z0-9_$]*$") then
            return ngx.exit(400)
        end
        ngx.ctx.catalog_callback = cb
    }

    header_filter_by_lua_block {
        if ngx.status ~= 200 then return end
        if ngx.ctx.catalog_callback then
            ngx.header.content_length = nil
            ngx.header.content_type = "application/javascript; charset=utf-8"
        else
            ngx.header.content_type = "application/json; charset=utf-8"
        end
    }

    body_filter_by_lua_block {
        local cb = ngx.ctx.catalog_callback
        if not cb or ngx.status ~= 200 then return end
        local chunk = ngx.arg[1] or ""
        if not ngx.ctx.catalog_started then
            chunk = cb .. "(" .. chunk
            ngx.ctx.catalog_started = true
        end
        if ngx.arg[2] then chunk = chunk .. ");" end
        ngx.arg[1] = chunk
    }
}
